name: Quick Build (Linux)

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      API_ID: 2040
      API_HASH: b18441a1ff607e10a989891a5462e627

    steps:
      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set temp paths
        run: echo "WORKDIR=$RUNNER_TEMP/tdesktop" >> $GITHUB_ENV

      - name: Prepare workspace (slim copy)
        run: |
          mkdir -p "$WORKDIR"
          rsync -a --delete --exclude '.git' ./ "$WORKDIR"/

      - name: Run configure+build (Debug, minimal)
        run: |
          cd "$WORKDIR"
          docker run --rm -i \
            -u "$(id -u)" \
            -v "$WORKDIR:/usr/src/tdesktop" \
            -e CONFIG=Debug \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D TDESKTOP_API_ID=$API_ID \
              -D TDESKTOP_API_HASH=$API_HASH \
              -D CMAKE_RUNTIME_OUTPUT_DIRECTORY=/usr/src/tdesktop/out/bin \
              -D CMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=/usr/src/tdesktop/out/bin \
              -D CMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=/usr/src/tdesktop/out/bin

      - name: Show out/ tree
        if: success()
        run: |
          cd "$WORKDIR"
          chmod +x ./scripts/print-out-tree.sh
          ./scripts/print-out-tree.sh out

      - name: Collect linux binary
        if: always()
        run: |
          cd "$WORKDIR"
          mkdir -p "$RUNNER_TEMP/linux-binary"
          binary_path="out/bin/UzbekGram"
          if [ ! -f "$binary_path" ]; then
            echo "Binary not found in out/bin/." >&2
            find out -maxdepth 4 -type f -executable -print
            exit 1
          fi
          cp -v "$binary_path" "$RUNNER_TEMP/linux-binary/"

      - name: Upload linux build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: ${{ runner.temp }}/linux-binary
          if-no-files-found: error
          retention-days: 7

      - name: Disk usage after
        if: always()
        run: df -h
