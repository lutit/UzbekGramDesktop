name: Build (Linux)

on:
  workflow_dispatch:

jobs:
  quick-build:
    runs-on: ubuntu-22.04
    env:
      API_ID: 2040
      API_HASH: b18441a1ff607e10a989891a5462e627

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free space before build
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Set temp paths
        run: |
          echo "WORKDIR=$RUNNER_TEMP/tdesktop" >> $GITHUB_ENV
          echo "ARTIFACT=$RUNNER_TEMP/quick-build-logs.tar.gz" >> $GITHUB_ENV

      - name: Prepare workspace (slim copy)
        run: |
          mkdir -p "$WORKDIR"
          rsync -a --delete --exclude '.git' ./ "$WORKDIR"/

      - name: Run configure+build
        run: |
          cd "$WORKDIR"
          docker run --rm -i \
            -u "$(id -u)" \
            -v "$WORKDIR:/usr/src/tdesktop" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D TDESKTOP_API_ID=$API_ID \
              -D TDESKTOP_API_HASH=$API_HASH \
              -D CMAKE_RUNTIME_OUTPUT_DIRECTORY=/usr/src/tdesktop/out/bin \
              -D CMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=/usr/src/tdesktop/out/bin \
              -D CMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=/usr/src/tdesktop/out/bin

      - name: Show out/ tree
        if: success()
        run: |
          cd "$WORKDIR"
          chmod +x ./scripts/print-out-tree.sh
          ./scripts/print-out-tree.sh out

      - name: Collect linux binary
        if: always()
        run: |
          cd "$WORKDIR"
          mkdir -p "$RUNNER_TEMP/linux-binary"
          binary_path="out/bin/UzbekGram"
          if [ ! -f "$binary_path" ]; then
            echo "Binary not found in out/bin/." >&2
            find out -maxdepth 4 -type f -executable -print
            exit 1
          fi
          cp -v "$binary_path" "$RUNNER_TEMP/linux-binary/"

      - name: Keep only log + small artifact
        if: always()
        run: |
          cd "$WORKDIR"
          ls -R out | head -n 200 || true
          mkdir -p "$RUNNER_TEMP/quick-out"
          # Collect only binaries + minimal logs
          find out -type f \( -name 'Telegram' -o -name 'uzbekgram' -o -name '*.so' -o -name '*.dll' -o -name '*.log' \) -print0 \
            | tar --null -T - -czf "$ARTIFACT" || true
          ls -lh "$ARTIFACT" || true

      - name: Upload quick-build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-build-logs
          path: ${{ env.ARTIFACT }}
          retention-days: 3

      - name: Upload linux build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ runner.temp }}/linux-binary
          if-no-files-found: error
          retention-days: 7

      - name: Disk usage after
        if: always()
        run: df -h
